<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2D Fluid Simulation</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    // Configuration
    const N = 128;              // Grid resolution
    const iter = 4;             // Solver iterations
    const dt = 0.1;             // Time step
    const diff = 0.0001;        // Diffusion rate
    const visc = 0.0001;        // Viscosity
    const decay = 0.9;         // Density decay per frame

    // Grid data arrays
    const size = (N + 2) * (N + 2);
    let dens = new Array(size).fill(0);
    let dens0 = new Array(size).fill(0);
    let velX = new Array(size).fill(0);
    let velY = new Array(size).fill(0);
    let velX0 = new Array(size).fill(0);
    let velY0 = new Array(size).fill(0);

    // Index helper
    function IX(i, j) { return i + (N + 2) * j; }

    // Add source (density/velocity)
    function addSource(x, s) {
      for (let i = 0; i < size; i++) x[i] += dt * s[i];
    }

    // Set boundaries
    function setBnd(b, x) {
      for (let i = 1; i <= N; i++) {
        x[IX(0, i)]     = b === 1 ? -x[IX(1, i)] : x[IX(1, i)];
        x[IX(N+1, i)]   = b === 1 ? -x[IX(N, i)] : x[IX(N, i)];
        x[IX(i, 0)]     = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
        x[IX(i, N+1)]   = b === 2 ? -x[IX(i, N)] : x[IX(i, N)];
      }
      // Corners
      x[IX(0, 0)]         = 0.5 * (x[IX(1, 0)]     + x[IX(0, 1)]);
      x[IX(0, N+1)]       = 0.5 * (x[IX(1, N+1)]   + x[IX(0, N)]);
      x[IX(N+1, 0)]       = 0.5 * (x[IX(N, 0)]     + x[IX(N+1, 1)]);
      x[IX(N+1, N+1)]     = 0.5 * (x[IX(N, N+1)]   + x[IX(N+1, N)]);
    }

    // Linear solver (Gauss-Seidel)
    function linSolve(b, x, x0, a, c) {
      for (let k = 0; k < iter; k++) {
        for (let j = 1; j <= N; j++) {
          for (let i = 1; i <= N; i++) {
            x[IX(i, j)] = (x0[IX(i, j)] + a*(
              x[IX(i-1, j)] + x[IX(i+1, j)] +
              x[IX(i, j-1)] + x[IX(i, j+1)]
            )) / c;
          }
        }
        setBnd(b, x);
      }
    }

    // Diffusion step
    function diffuse(b, x, x0, diff) {
      const a = dt * diff * N * N;
      linSolve(b, x, x0, a, 1 + 4 * a);
    }

    // Advection step
    function advect(b, d, d0, velocX, velocY) {
      const dt0 = dt * N;
      for (let j = 1; j <= N; j++) {
        for (let i = 1; i <= N; i++) {
          let x = i - dt0 * velocX[IX(i, j)];
          let y = j - dt0 * velocY[IX(i, j)];
          x = Math.max(0.5, Math.min(N + 0.5, x));
          y = Math.max(0.5, Math.min(N + 0.5, y));
          const i0 = Math.floor(x), i1 = i0 + 1;
          const j0 = Math.floor(y), j1 = j0 + 1;
          const s1 = x - i0, s0 = 1 - s1;
          const t1 = y - j0, t0 = 1 - t1;
          d[IX(i, j)] =
            s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
            s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
        }
      }
      setBnd(b, d);
    }

    // Projection step (make flow divergence-free)
    function project(velocX, velocY, p, div) {
      for (let j = 1; j <= N; j++) {
        for (let i = 1; i <= N; i++) {
          div[IX(i, j)] = -0.5 * (
            velocX[IX(i+1, j)] - velocX[IX(i-1, j)] +
            velocY[IX(i, j+1)] - velocY[IX(i, j-1)]
          ) / N;
          p[IX(i, j)] = 0;
        }
      }
      setBnd(0, div);
      setBnd(0, p);
      linSolve(0, p, div, 1, 4);
      for (let j = 1; j <= N; j++) {
        for (let i = 1; i <= N; i++) {
          velocX[IX(i, j)] -= 0.5 * N * (p[IX(i+1, j)] - p[IX(i-1, j)]);
          velocY[IX(i, j)] -= 0.5 * N * (p[IX(i, j+1)] - p[IX(i, j-1)]);
        }
      }
      setBnd(1, velocX);
      setBnd(2, velocY);
    }

    // Velocity step
    function velStep() {
      addSource(velX, velX0);
      addSource(velY, velY0);
      velX0.fill(0); velY0.fill(0);
      diffuse(1, velX0, velX, visc);
      diffuse(2, velY0, velY, visc);
      project(velX0, velY0, velX, velY);
      advect(1, velX, velX0, velX0, velY0);
      advect(2, velY, velY0, velX0, velY0);
      project(velX, velY, velX0, velY0);
    }

    // Density step
    function densStep() {
      addSource(dens, dens0);
      dens0.fill(0);
      diffuse(0, dens0, dens, diff);
      advect(0, dens, dens0, velX, velY);
      // Apply decay so density fades over time
      for (let i = 0; i < size; i++) dens[i] *= decay;
    }

    // Canvas setup
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Render density
    function renderDens() {
      const w = canvas.width / N;
      const h = canvas.height / N;
      for (let j = 0; j < N; j++) {
        for (let i = 0; i < N; i++) {
          const d = dens[IX(i+1, j+1)];
          ctx.fillStyle = `rgba(0, 0, 255, ${d})`;
          ctx.fillRect(i * w, j * h, w, h);
        }
      }
    }

    // Automatic source at center
    function emitSource() {
      const i = Math.floor(N/2), j = Math.floor(N/2);
      const idx = IX(i, j);
      dens0[idx] = 100;
    }

    // Animation loop
    function update() {
      emitSource();
      velStep();
      densStep();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      renderDens();
      requestAnimationFrame(update);
    }
    update();

    // Mouse interaction
    let isMouseDown = false;
    canvas.addEventListener('mousedown', () => isMouseDown = true);
    canvas.addEventListener('mouseup',   () => isMouseDown = false);
    canvas.addEventListener('mousemove', e => {
      if (!isMouseDown) return;
      const rect = canvas.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / canvas.width) * N + 1;
      const y = ((e.clientY - rect.top)  / canvas.height)* N + 1;
      const i = Math.floor(x), j = Math.floor(y);
      if (i < 1 || i > N || j < 1 || j > N) return;
      const index = IX(i, j);
      dens0[index] = 100;
      velX0[index] = (e.movementX || 0) * 5;
      velY0[index] = (e.movementY || 0) * 5;
    });
  </script>
</body>
</html>
